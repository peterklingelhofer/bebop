[project]
name = "bebop"
version = "0.1.0"
description = "Adds advanced jazz comping to existing songs via reharmonization."
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.11.0",
    "mido>=1.3.3",
    "music21>=9.9.1",
    "numpy>=2.4.4",
    "pretty-midi>=0.2.11",
    "scipy>=1.17.1",
    "setuptools>=82.0.1",
    "soundfile>=0.13.1",
]

[project.scripts]
bebop = "bebop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bebop"]
